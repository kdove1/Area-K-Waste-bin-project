<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tribin UI - Prototype 1</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Campus Tribin Locations</h1>
      <span>Prototype 1</span>
    </header>

    <main>
      <section class="location-panel">
        <div class="plot-label">NORTH</div>
        <div id="campusPlot" aria-label="Relative campus bin locations"></div>
        <p class="plot-note">Relative positions based on the PDF coordinates</p>
      </section>

      <aside>
        <h2>Bins</h2>
        <input id="search" type="search" placeholder="Search bin number or location" />
        <p id="count"></p>
        <div id="selectedBin" class="selected-bin">Select a point or bin</div>
        <div id="binList"></div>
      </aside>
    </main>

    <script src="bins.js"></script>
    <script src="app.js"></script>
  </body>
</html>
